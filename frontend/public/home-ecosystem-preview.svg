<svg xmlns="http://www.w3.org/2000/svg" width="1895" height="888" viewBox="0 0 1895 888">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4fbfb"/>
      <stop offset="0.55" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef7f8"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1f3a"/>
      <stop offset="1" stop-color="#12344d"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a8d93"/>
      <stop offset="1" stop-color="#00bfa6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#143041" flood-opacity="0.13"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <style>
      .eyebrow{font:700 18px Arial,sans-serif;letter-spacing:8px;text-transform:uppercase;fill:#0a8d93}
      .title{font:800 78px Arial,sans-serif;letter-spacing:-3px;fill:#0b1f3a}
      .body{font:400 27px Arial,sans-serif;fill:#546575}
      .metric{font:800 42px Arial,sans-serif;fill:#0b1f3a}
      .metricLabel{font:700 16px Arial,sans-serif;letter-spacing:2px;text-transform:uppercase;fill:#748696}
      .stepTitle{font:800 23px Arial,sans-serif;fill:#ffffff}
      .stepText{font:500 16px Arial,sans-serif;fill:#bdd4dc}
      .cardTitle{font:800 21px Arial,sans-serif;fill:#0b1f3a}
    </style>
  </defs>

  <rect width="1895" height="888" fill="url(#bg)"/>
  <circle cx="148" cy="122" r="210" fill="#dff5f4" opacity="0.75" filter="url(#soft)"/>
  <circle cx="1588" cy="740" r="260" fill="#dcf3f1" opacity="0.65" filter="url(#soft)"/>

  <g transform="translate(108 112)">
    <rect x="0" y="0" width="338" height="46" rx="23" fill="#e7f5f5"/>
    <text x="28" y="31" class="eyebrow" style="font-size:15px;letter-spacing:5px">Skills Lab Ecosystem</text>
    <text x="0" y="145" class="title">Design.</text>
    <text x="0" y="228" class="title">Equip.</text>
    <text x="0" y="311" class="title" fill="#0a8d93">Train.</text>
    <text x="0" y="394" class="title">Sustain.</text>
    <text x="3" y="462" class="body">A complete healthcare education journey</text>
    <text x="3" y="503" class="body">from lab planning to products, faculty</text>
    <text x="3" y="544" class="body">training and long-term service support.</text>
    <rect x="0" y="596" width="236" height="58" rx="29" fill="url(#teal)"/>
    <text x="34" y="633" style="font:800 19px Arial,sans-serif;fill:#fff">Explore Solutions -&gt;</text>
  </g>

  <g transform="translate(690 82)" filter="url(#shadow)">
    <rect x="0" y="0" width="700" height="710" rx="34" fill="#ffffff" stroke="#d9e8ea"/>
    <rect x="32" y="32" width="636" height="646" rx="28" fill="#f7fbfb"/>
    <path d="M350 84 C500 150 510 305 350 372 C204 435 190 558 350 630" fill="none" stroke="#0a8d93" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 18" opacity="0.34"/>
    <circle cx="350" cy="84" r="12" fill="#0a8d93"/>
    <circle cx="350" cy="372" r="12" fill="#0a8d93"/>
    <circle cx="350" cy="630" r="12" fill="#0a8d93"/>

    <g transform="translate(82 84)">
      <rect width="260" height="174" rx="18" fill="#fff" stroke="#e0eaed"/>
      <path d="M92 32c34-24 98-8 116 34 18 44-16 80-54 88-44 9-91-14-101-52-8-31 9-54 39-70z" fill="#f7b29e"/>
      <path d="M86 56c38 4 70 33 74 80M126 31c-3 51 4 84 33 121M178 58c-38 18-74 24-116 20" fill="none" stroke="#d9534f" stroke-width="6" opacity=".75"/>
      <text x="22" y="151" class="cardTitle">Anatomy Models</text>
    </g>
    <g transform="translate(360 248)">
      <rect width="260" height="174" rx="18" fill="#fff" stroke="#e0eaed"/>
      <path d="M86 90c0-42 34-72 74-64 42 9 62 52 45 90-18 42-78 50-108 15-7-8-11-22-11-41z" fill="#f38d63"/>
      <path d="M128 29c-2 64-6 80-28 111M161 32c4 55 8 72 43 93M92 101c43-20 73-20 115 2" fill="none" stroke="#0f6fff" stroke-width="7" opacity=".75"/>
      <text x="22" y="151" class="cardTitle">Simulation Labs</text>
    </g>
    <g transform="translate(105 454)">
      <rect width="260" height="174" rx="18" fill="#fff" stroke="#e0eaed"/>
      <path d="M62 106c42-56 103-73 166-50-34 8-48 28-67 58-28 8-61 5-99-8z" fill="#d7eaf1"/>
      <path d="M82 101c45-9 74-22 110-56M110 116c30-34 54-56 84-73" fill="none" stroke="#d9534f" stroke-width="7" opacity=".7"/>
      <text x="22" y="151" class="cardTitle">Task Trainers</text>
    </g>
    <g transform="translate(428 516)">
      <rect width="180" height="96" rx="18" fill="url(#navy)"/>
      <text x="24" y="38" style="font:800 30px Arial,sans-serif;fill:#fff">360</text>
      <text x="24" y="66" style="font:600 15px Arial,sans-serif;fill:#bdd4dc">Lab support</text>
    </g>
  </g>

  <g transform="translate(1435 128)">
    <rect x="0" y="0" width="354" height="168" rx="22" fill="url(#navy)"/>
    <text x="34" y="54" class="stepTitle">01  Plan the Lab</text>
    <text x="34" y="92" class="stepText">Room layout, equipment list,</text>
    <text x="34" y="120" class="stepText">council-ready setup guidance.</text>
    <circle cx="315" cy="50" r="20" fill="#123f57"/><text x="304" y="58" style="font:800 24px Arial;fill:#74dce5">-&gt;</text>

    <rect x="0" y="204" width="354" height="168" rx="22" fill="#ffffff" stroke="#d9e8ea"/>
    <text x="34" y="258" style="font:800 23px Arial,sans-serif;fill:#0b1f3a">02  Equip &amp; Install</text>
    <text x="34" y="296" style="font:500 17px Arial,sans-serif;fill:#6f8090">Models, simulators, trainers</text>
    <text x="34" y="324" style="font:500 17px Arial,sans-serif;fill:#6f8090">and practical lab readiness.</text>
    <circle cx="315" cy="254" r="20" fill="#e8f7f7"/><text x="304" y="262" style="font:800 24px Arial;fill:#0a8d93">-&gt;</text>

    <rect x="0" y="408" width="354" height="168" rx="22" fill="#ffffff" stroke="#d9e8ea"/>
    <text x="34" y="462" style="font:800 23px Arial,sans-serif;fill:#0b1f3a">03  Train &amp; Maintain</text>
    <text x="34" y="500" style="font:500 17px Arial,sans-serif;fill:#6f8090">Faculty onboarding, product</text>
    <text x="34" y="528" style="font:500 17px Arial,sans-serif;fill:#6f8090">support and long-term service.</text>
    <circle cx="315" cy="458" r="20" fill="#e8f7f7"/><text x="304" y="466" style="font:800 24px Arial;fill:#0a8d93">-&gt;</text>
  </g>

  <g transform="translate(108 784)">
    <rect width="1678" height="1" fill="#dbe8eb"/>
    <g transform="translate(0 28)"><text class="metric">4+</text><text x="88" y="-3" class="metricLabel">Lab verticals</text></g>
    <g transform="translate(404 28)"><text class="metric">17+</text><text x="108" y="-3" class="metricLabel">Active products</text></g>
    <g transform="translate(820 28)"><text class="metric">24/7</text><text x="128" y="-3" class="metricLabel">Service mindset</text></g>
    <g transform="translate(1240 28)"><text class="metric">360</text><text x="112" y="-3" class="metricLabel">Implementation</text></g>
  </g>
</svg>
